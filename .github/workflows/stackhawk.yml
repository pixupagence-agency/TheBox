name: "StackHawk DAST Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  hawkscan:
    name: "Run StackHawk DAST Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Build Next.js application"
        run: npm run build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_sample"
          STRIPE_SECRET_KEY: "sk_test_sample"
          STRIPE_WEBHOOK_SECRET: "whsec_sample"

      - name: "Start Next.js server in background"
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: "Run HawkScan Security Analysis"
        uses: stackhawk/hawkscan-action@v4
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
          environment: Development
