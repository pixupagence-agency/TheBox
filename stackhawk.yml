# ==============================================================================
# StackHawk (HawkScan) Configuration for The Box (Next.js Application)
# Documentation: https://docs.stackhawk.com/hawkscan/configuration/
# ==============================================================================

app:
  # Identifiant d'application StackHawk (à renseigner depuis https://app.stackhawk.com)
  applicationId: ${HAWK_APP_ID:00000000-0000-0000-0000-000000000000}
  
  # Environnement analysé
  env: ${HAWK_ENV:Development}
  
  # URL cible où l'application Next.js est en cours d'exécution
  host: ${APP_HOST:http://localhost:3000}

  # Explorateur d'API et de pages web
  openApiVersion: false

# Configuration de l'analyse dynamique (DAST)
hawk:
  spider:
    # Profondeur maximale d'exploration des liens et routes
    maxDepth: 5
    # Durée maximale en minutes pour l'exploration
    maxDurationMinutes: 5

  # Détection des vulnérabilités OWASP Top 10
  # (Injections, XSS, En-têtes manquants, Exposition de données, etc.)
  failureThreshold: HIGH

# Chemins exclus de l'analyse (fichiers statiques et assets PWA)
# pour concentrer l'analyse sur le code et les routes API
excludePaths:
  - "/_next/**"
  - "/*.png"
  - "/*.svg"
  - "/*.ico"
  - "/*.webmanifest"
